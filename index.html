<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <link rel="stylesheet" href="index.css" />
    <script src="index.js"></script>
  </head>
  <body>
    <section class="quiz-container">
      <div id="quiz-content" class="quiz-content">
        <div id="quiz-introduction">
          <h1 class="quiz-title">
            Wissen ist Macht.<br />
            Zeig was du hast!
            <span class="emoji">🚀</span>
          </h1>
          <p class="quiz-subtitle">
            Luke brauchte Jahre, um die Macht zu meistern. Du hast ein paar
            Minuten. 😏
          </p>
        </div>
        <div id="display-footer" class="footer">
          <button id="footer-btn" class="btn" onclick="nextQuestion()">
            Möge das Quiz beginnen!
          </button>
        </div>
      </div>
    </section>
  </body>
</html>
